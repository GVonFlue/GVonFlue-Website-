<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Core — VIP Command Center</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0C2470; --navy-deep:#081747; --blue:#3C78CC; --blue-lt:#7FB2FF;
    --orange:#FF5500; --white:#FFFFFF; --black:#050505;
    --bg-card:#0E1A3D; --bg-card-2:#0B1530; --border:rgba(91,149,227,.22);
    --border-hi:rgba(91,149,227,.45); --txt:#EAF1FF; --txt-mut:#9FB2D8; --txt-dim:#6B82AE;
    --s-id:#64748B; --s-fc:#3C78CC; --s-bd:#7FB2FF; --s-ad:#FF5500;
    --disp:"Clash Display","Sora",system-ui,sans-serif;
    --body:"Satoshi","Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--body); color:var(--txt); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(60,120,204,.18), transparent 60%),
      radial-gradient(900px 500px at 0% 100%, rgba(255,85,0,.10), transparent 55%),
      linear-gradient(160deg,#050505 0%, #081024 38%, #0C2470 140%);
    background-attachment:fixed; padding:0 0 80px;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}

  /* HEADER */
  header{padding:26px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:18px;min-width:0}
  .brand img{height:64px;width:auto;filter:drop-shadow(0 0 18px rgba(60,120,204,.35))}
  .brand .ttl{display:flex;flex-direction:column;gap:2px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:23px;letter-spacing:.5px;line-height:1.05;
    background:linear-gradient(90deg,#fff,#9FC4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:12px;color:var(--txt-mut);letter-spacing:.4px;text-transform:uppercase}
  .add-btn{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.4px;cursor:pointer;
    color:#fff;background:linear-gradient(180deg,#FF6A22,#FF5500);border:none;padding:13px 20px;border-radius:11px;
    box-shadow:0 6px 22px rgba(255,85,0,.32);transition:transform .12s, box-shadow .12s;display:flex;align-items:center;gap:8px}
  .add-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,85,0,.42)}
  .add-btn:active{transform:translateY(0) scale(.98)}

  /* METRICS */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;margin:22px 0 6px}
  .metric{background:linear-gradient(180deg,var(--bg-card),var(--bg-card-2));border:1px solid var(--border);
    border-radius:15px;padding:16px 18px;position:relative;overflow:hidden}
  .metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,var(--blue))}
  .metric .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt-mut);font-weight:500}
  .metric .val{font-family:var(--disp);font-weight:700;font-size:31px;line-height:1.1;margin-top:5px;color:var(--accent,#fff)}
  .metric .hint{font-size:11px;color:var(--txt-dim);margin-top:2px}

  /* TOOLBAR */
  .toolbar{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin:24px 0 18px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;background:var(--bg-card-2);border:1px solid var(--border);color:var(--txt);
    border-radius:11px;padding:11px 14px 11px 38px;font-size:14px;font-family:var(--body);outline:none;transition:border .15s}
  .search input:focus{border-color:var(--border-hi)}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
  .seg{display:flex;background:var(--bg-card-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
  .seg button{font-family:var(--body);font-weight:500;font-size:13px;color:var(--txt-mut);background:none;border:none;
    cursor:pointer;padding:8px 15px;border-radius:8px;transition:all .12s}
  .seg button.on{background:var(--blue);color:#fff}
  select.filter{background:var(--bg-card-2);border:1px solid var(--border);color:var(--txt);border-radius:11px;
    padding:11px 14px;font-size:13px;font-family:var(--body);outline:none;cursor:pointer}

  /* BOARD */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .col{background:rgba(8,16,40,.5);border:1px solid var(--border);border-radius:16px;padding:13px 11px;min-height:200px;
    transition:border .15s, background .15s}
  .col.drag-over{border-color:var(--orange);background:rgba(255,85,0,.07)}
  .col-head{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;border-bottom:1px solid var(--border);margin-bottom:11px}
  .col-head .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .col-head .nm{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.3px;flex:1}
  .col-head .ct{font-size:12px;color:var(--txt-dim);background:var(--bg-card-2);border-radius:20px;padding:2px 9px;font-weight:500}

  .card{background:linear-gradient(180deg,var(--bg-card),var(--bg-card-2));border:1px solid var(--border);
    border-radius:13px;padding:12px;margin-bottom:10px;cursor:grab;transition:transform .12s, border .12s, box-shadow .12s;position:relative}
  .card:hover{border-color:var(--border-hi);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card .top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .card .av{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy))}
  .card .nm{font-weight:700;font-size:14px;line-height:1.15}
  .card .biz{font-size:11.5px;color:var(--txt-mut);margin-top:1px}
  .card .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
  .pill{font-size:10.5px;padding:3px 8px;border-radius:7px;font-weight:500;display:inline-flex;align-items:center;gap:4px;letter-spacing:.2px}
  .pill.cold{background:rgba(255,85,0,.14);color:#FF9A66}
  .pill.warm{background:rgba(91,149,227,.16);color:#9FC4FF}
  .pill.fresh{background:rgba(73,222,128,.14);color:#7BE3A0}
  .pill.cat{background:rgba(255,255,255,.06);color:var(--txt-mut)}
  .card .next{font-size:11.5px;color:var(--txt-mut);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
  .card .next b{color:var(--orange);font-weight:500;flex:none}
  .star{color:var(--orange);font-size:12px;letter-spacing:1px}

  /* MODAL */
  .ov{position:fixed;inset:0;background:rgba(3,6,16,.74);backdrop-filter:blur(5px);z-index:60;
    display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
  .ov.show{display:flex}
  .modal{background:linear-gradient(170deg,#0C1838,#0A1228);border:1px solid var(--border-hi);border-radius:20px;
    width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .m-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:13px}
  .m-head .av{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:600;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy))}
  .m-head h2{font-family:var(--disp);font-weight:600;font-size:18px;flex:1;line-height:1.1}
  .m-head h2 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--txt-mut);margin-top:2px}
  .x{background:none;border:1px solid var(--border);color:var(--txt-mut);width:34px;height:34px;border-radius:9px;
    cursor:pointer;font-size:18px;line-height:1;transition:all .12s}
  .x:hover{border-color:var(--orange);color:var(--orange)}
  .m-body{padding:20px 22px;max-height:64vh;overflow-y:auto}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-mut);
    font-weight:500;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;background:var(--bg-card-2);border:1px solid var(--border);
    color:var(--txt);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--body);outline:none;transition:border .15s}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--border-hi)}
  .field textarea{resize:vertical;min-height:58px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .give-get{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .give-get .field{margin-bottom:0}
  .gg-give label{color:#7BE3A0}.gg-get label{color:#9FC4FF}
  .stagepick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .stagepick button{font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--txt-mut);background:var(--bg-card-2);
    border:1px solid var(--border);border-radius:9px;padding:9px 4px;cursor:pointer;transition:all .12s}
  .stagepick button.on{color:#fff;border-color:transparent}

  /* notes */
  .notes-sec{border-top:1px solid var(--border);margin-top:6px;padding-top:16px}
  .notes-sec .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .notes-sec .hd b{font-family:var(--disp);font-weight:600;font-size:14px}
  .touch-btn{font-family:var(--body);font-weight:500;font-size:12px;cursor:pointer;color:var(--orange);
    background:rgba(255,85,0,.12);border:1px solid rgba(255,85,0,.3);border-radius:8px;padding:7px 12px;transition:all .12s}
  .touch-btn:hover{background:rgba(255,85,0,.2)}
  .note-add{display:flex;gap:8px;margin-bottom:12px}
  .note-add input{flex:1}
  .note-add button{background:var(--blue);border:none;color:#fff;border-radius:10px;padding:0 16px;cursor:pointer;
    font-family:var(--body);font-weight:500;font-size:13px;transition:filter .12s}
  .note-add button:hover{filter:brightness(1.12)}
  .note{background:var(--bg-card-2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:0 9px 9px 0;
    padding:9px 12px;margin-bottom:8px;font-size:13px;line-height:1.5}
  .note .d{font-size:10.5px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;
    display:flex;justify-content:space-between;align-items:center}
  .note .del{cursor:pointer;color:var(--txt-dim);opacity:.6}.note .del:hover{color:var(--orange);opacity:1}
  .empty-n{font-size:12.5px;color:var(--txt-dim);font-style:italic;padding:4px 0}

  .m-foot{padding:15px 22px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}
  .del-btn{background:none;border:1px solid rgba(255,85,0,.35);color:#FF9A66;border-radius:10px;padding:11px 15px;
    cursor:pointer;font-family:var(--body);font-weight:500;font-size:13px;transition:all .12s}
  .del-btn:hover{background:rgba(255,85,0,.14)}
  .save-btn{flex:1;background:linear-gradient(180deg,#FF6A22,#FF5500);border:none;color:#fff;border-radius:11px;
    padding:13px;cursor:pointer;font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.4px;
    box-shadow:0 6px 20px rgba(255,85,0,.3);transition:transform .12s}
  .save-btn:hover{transform:translateY(-1px)}

  /* LIST VIEW */
  .listv{display:none;flex-direction:column;gap:8px}
  .listv.show{display:flex}.board.hide{display:none}
  .lrow{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,var(--bg-card),var(--bg-card-2));
    border:1px solid var(--border);border-radius:12px;padding:11px 15px;cursor:pointer;transition:border .12s, transform .12s}
  .lrow:hover{border-color:var(--border-hi);transform:translateX(3px)}
  .lrow .av{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--navy))}
  .lrow .info{flex:1;min-width:0}
  .lrow .nm{font-weight:700;font-size:14px}.lrow .biz{font-size:11.5px;color:var(--txt-mut)}
  .lrow .stagebadge{font-size:11px;font-weight:500;padding:5px 11px;border-radius:8px;color:#fff;flex:none}
  .footer-note{text-align:center;color:var(--txt-dim);font-size:11.5px;margin-top:30px;line-height:1.7}
  .footer-note .reset{color:var(--txt-mut);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .footer-note .reset:hover{color:var(--orange)}
  .bell{background:var(--bg-card-2);border:1px solid var(--border);border-radius:11px;width:42px;height:42px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border .12s}
  .bell:hover{border-color:var(--border-hi)}
  .fupanel{background:linear-gradient(180deg,rgba(255,85,0,.10),rgba(11,21,48,.6));border:1px solid rgba(255,85,0,.3);
    border-radius:16px;padding:16px 18px;margin-bottom:18px}
  .fupanel .ph{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:600;font-size:14px;margin-bottom:12px}
  .fupanel .ph .pc{color:var(--orange)}
  .fugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
  .fucard{background:var(--bg-card-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px}
  .fucard.over{border-left:3px solid var(--orange);border-radius:0 11px 11px 0}
  .fucard.now{border-left:3px solid var(--blue-lt);border-radius:0 11px 11px 0}
  .fucard .fi{flex:1;min-width:0;cursor:pointer}
  .fucard .nm{font-weight:700;font-size:13px}.fucard .due{font-size:11px;color:var(--txt-mut)}
  .fucard .acts{display:flex;gap:5px;flex:none}
  .fucard .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--txt-mut);transition:all .12s}
  .fucard .ib:hover{border-color:var(--border-hi);color:#fff}
  .fucard .ib.done:hover{border-color:#49DE80;color:#7BE3A0}
  .fucard .ib.cal:hover{border-color:var(--blue-lt);color:var(--blue-lt)}
  /* cadence + calendar in modal */
  .cadence{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .cadence button{font-family:var(--body);font-size:11.5px;font-weight:500;color:var(--blue-lt);background:rgba(91,149,227,.12);
    border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;transition:all .12s}
  .cadence button:hover{border-color:var(--border-hi);background:rgba(91,149,227,.2)}
  .cadence button.clr{color:var(--txt-mut);background:none}
  .gcal{display:inline-flex;align-items:center;gap:7px;margin-top:9px;font-family:var(--body);font-weight:500;font-size:12.5px;
    color:var(--blue-lt);background:rgba(91,149,227,.1);border:1px solid var(--border);border-radius:9px;padding:8px 13px;
    cursor:pointer;text-decoration:none;transition:all .12s}
  .gcal:hover{border-color:var(--border-hi);background:rgba(91,149,227,.18)}
  .gcal.off{opacity:.45;pointer-events:none}
  @media(max-width:880px){.board{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.board{grid-template-columns:1fr}.row2,.give-get,.stagepick{grid-template-columns:1fr 1fr}
    .brand h1{font-size:19px}.brand img{height:50px}}
</style>

function load(){
  try{ const r=localStorage.getItem(KEY); if(r===null) throw 0; DATA=JSON.parse(r); }
  catch(e){ DATA=seedData(); save(); }
  DATA.forEach(c=>{ if(c.followUp===undefined) c.followUp=""; });
  buildCatFilter(); render(); maybeNotify();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){ console.error(e); } }

function backupData(){
  const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='gvonflue-vip-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
function restoreData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); if(!Array.isArray(d)) throw 0;
      if(!confirm('Replace your current data with this backup? ('+d.length+' contacts)')){ input.value=''; return; }
      DATA=d; DATA.forEach(c=>{ if(c.followUp===undefined) c.followUp=""; });
      save(); buildCatFilter(); render(); alert('Restored '+d.length+' contacts.');
    }catch(e){ alert('That file could not be read as a valid backup.'); }
    input.value='';
  };
  r.readAsText(f);
}

function initials(n){ return n.replace(/\(.*?\)/g,"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function daysSince(d){ if(!d) return null; return Math.floor((Date.now()-new Date(d+"T00:00").getTime())/864e5); }
function touchPill(c){
  const d=daysSince(c.lastTouch);
  if(d===null) return '<span class="pill cold">No touch yet</span>';
  if(d>30) return '<span class="pill cold">Cold · '+d+'d</span>';
  if(d>10) return '<span class="pill warm">'+d+'d ago</span>';
  return '<span class="pill fresh">'+(d===0?'Today':d+'d ago')+'</span>';
}
function stars(n){ return '<span class="star">'+'★'.repeat(n||0)+'</span>'; }

function fuStatus(c){
  if(!c.followUp) return null;
  const d=daysSince(c.followUp); // days SINCE the follow-up date (negative = future)
  if(d>0) return {state:'overdue',days:d,label:'Overdue '+d+'d'};
  if(d===0) return {state:'today',days:0,label:'Due today'};
  if(d>=-7) return {state:'soon',days:-d,label:'In '+(-d)+'d'};
  return {state:'future',days:-d,label:'In '+(-d)+'d'};
}
function fuPill(c){
  const s=fuStatus(c); if(!s) return '';
  const cls=s.state==='overdue'?'cold':(s.state==='today'?'cold':(s.state==='soon'?'warm':'cat'));
  return `<span class="pill ${cls}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 8v4l2.5 2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg>${s.label}</span>`;
}
function gcalLink(c){
  if(!c.followUp) return '#';
  const d=c.followUp.replace(/-/g,''); // YYYYMMDD all-day
  const next=new Date(c.followUp+'T00:00'); next.setDate(next.getDate()+1);
  const end=next.toISOString().slice(0,10).replace(/-/g,'');
  const title=encodeURIComponent('Follow up: '+c.name+(c.biz?' ('+c.biz+')':''));
  const det=encodeURIComponent((c.next?'Next action: '+c.next+'\n':'')+(c.phone?'☎ '+c.phone+'\n':'')+(c.email?'✉ '+c.email+'\n':'')+'\n— GVonFlue Core VIP CRM');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}/${end}&details=${det}`;
}
function maybeNotify(){
  const due=DATA.filter(c=>{const s=fuStatus(c);return s&&(s.state==='overdue'||s.state==='today');});
  if(!due.length) return;
  if('Notification' in window && Notification.permission==='granted'){
    new Notification('Core VIP — '+due.length+' follow-up'+(due.length>1?'s':'')+' due',{body:due.slice(0,4).map(c=>c.name).join(', ')});
  }
}
function askNotify(){
  if(!('Notification' in window)){ alert('This browser does not support notifications.'); return; }
  Notification.requestPermission().then(p=>{ if(p==='granted') maybeNotify(); });
}

function buildCatFilter(){
  const cats=[...new Set(DATA.map(c=>c.biz).filter(Boolean))].sort();
  const sel=document.getElementById('catf'); const cur=sel.value;
  sel.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
}
function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function filtered(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const cat=document.getElementById('catf').value;
  return DATA.filter(c=>{
    if(cat && c.biz!==cat) return false;
    if(q && !(c.name.toLowerCase().includes(q)||(c.biz||"").toLowerCase().includes(q))) return false;
    return true;
  });
}

function render(){
  const list=filtered();
  // metrics
  const total=DATA.length, adv=DATA.filter(c=>c.stage==="Advocate").length,
    bld=DATA.filter(c=>c.stage==="Building").length,
    dueCt=DATA.filter(c=>{const s=fuStatus(c);return s&&(s.state==='overdue'||s.state==='today');}).length;
  document.getElementById('metrics').innerHTML=`
    ${metric('Total VIPs',total,'in your core',null)}
    ${metric('Advocates',adv,'fully activated','var(--orange)')}
    ${metric('Building',bld,'gaining momentum','var(--blue-lt)')}
    ${metric('Follow-ups due',dueCt,'overdue or today','var(--orange)')}`;

  // follow-up panel (overdue + today + next 7 days)
  renderFollowUps();

  // board
  const bd=document.getElementById('board');
  bd.innerHTML=STAGES.map(s=>{
    const items=list.filter(c=>c.stage===s.k);
    return `<div class="col" data-stage="${s.k}"
        ondragover="event.preventDefault();this.classList.add('drag-over')"
        ondragleave="this.classList.remove('drag-over')"
        ondrop="drop(event,'${s.k}')">
      <div class="col-head"><span class="dot" style="background:${s.c}"></span>
        <span class="nm">${s.k}</span><span class="ct">${items.length}</span></div>
      ${items.map(cardHtml).join('')||'<div class="empty-n" style="padding:8px 6px">—</div>'}
    </div>`;
  }).join('');

  // list
  const lv=document.getElementById('listv');
  lv.innerHTML=list.sort((a,b)=>(b.rank||0)-(a.rank||0)).map(c=>`
    <div class="lrow" onclick="openEdit('${c.id}')">
      <div class="av">${initials(c.name)}</div>
      <div class="info"><div class="nm">${esc(c.name)} ${stars(c.rank)}</div>
        <div class="biz">${esc(c.biz)||'—'}</div></div>
      ${touchPill(c)}${fuPill(c)}
      <span class="stagebadge" style="background:${SC[c.stage]}">${c.stage}</span>
    </div>`).join('')||'<div class="empty-n">No matches.</div>';

  // drag binding
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('dragstart',e=>{drag.id=el.dataset.id;el.classList.add('dragging');});
    el.addEventListener('dragend',e=>{el.classList.remove('dragging');document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));});
  });
}
function metric(l,v,h,acc){
  return `<div class="metric" style="--accent:${acc||'var(--blue)'}">
    <div class="lbl">${l}</div><div class="val">${v}</div><div class="hint">${h}</div></div>`;
}
function renderFollowUps(){
  const el=document.getElementById('fupanel');
  const due=DATA.map(c=>({c,s:fuStatus(c)}))
    .filter(x=>x.s && (x.s.state==='overdue'||x.s.state==='today'||x.s.state==='soon'))
    .sort((a,b)=>{
      const ord={overdue:0,today:1,soon:2};
      if(ord[a.s.state]!==ord[b.s.state]) return ord[a.s.state]-ord[b.s.state];
      return a.s.state==='soon' ? a.s.days-b.s.days : b.s.days-a.s.days;
    });
  if(!due.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="fupanel"><div class="ph">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF5500" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Follow-ups <span class="pc">·&nbsp;${due.length}</span></div>
    <div class="fugrid">${due.map(x=>{
      const cls=x.s.state==='overdue'?'over':(x.s.state==='today'?'now':'');
      return `<div class="fucard ${cls}">
        <div class="fi" onclick="openEdit('${x.c.id}')"><div class="nm">${esc(x.c.name)}</div>
          <div class="due">${x.s.label}${x.c.next?' · '+esc(x.c.next.slice(0,28)):''}</div></div>
        <div class="acts">
          <a class="ib cal" href="${gcalLink(x.c)}" target="_blank" title="Add to Google Calendar" onclick="event.stopPropagation()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></a>
          <button class="ib done" title="Mark done — logs a touch" onclick="markDone('${x.c.id}')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></button>
        </div></div>`;
    }).join('')}</div></div>`;
}
function markDone(id){
  const c=DATA.find(x=>x.id===id); if(!c) return;
  const today=new Date().toISOString().slice(0,10);
  c.lastTouch=today; c.followUp="";
  c.notes=c.notes||[]; c.notes.unshift({date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),text:'✓ Followed up — '+(c.next||'touched base')+'.'});
  save(); render();
}
function cardHtml(c){
  const next=c.next?`<div class="next"><b>Next:</b><span>${esc(c.next)}</span></div>`:'';
  return `<div class="card" draggable="true" data-id="${c.id}" onclick="openEdit('${c.id}')">
    <div class="top"><div class="av">${initials(c.name)}</div>
      <div><div class="nm">${esc(c.name)}</div><div class="biz">${esc(c.biz)||'—'} ${stars(c.rank)}</div></div></div>
    <div class="meta">${touchPill(c)}${fuPill(c)}${c.biz?`<span class="pill cat">${esc(c.biz.split(' / ')[0])}</span>`:''}</div>
    ${next}</div>`;
}

const drag={id:null};
async function drop(e,stage){
  e.preventDefault();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drag-over'));
  const c=DATA.find(x=>x.id===drag.id); if(c && c.stage!==stage){ c.stage=stage; await save(); render(); }
  drag.id=null;
}

function setView(v){ view=v;
  document.getElementById('vb').classList.toggle('on',v==='board');
  document.getElementById('vl').classList.toggle('on',v==='list');
  document.getElementById('board').classList.toggle('hide',v!=='board');
  document.getElementById('listv').classList.toggle('show',v==='list');
}

/* ---------- MODAL ---------- */
function openNew(){ editingId=null; draftNotes=[]; showModal({id:null,name:"",biz:"",stage:"Identified",rank:0,phone:"",email:"",lastTouch:"",followUp:"",next:"",give:"",get:"",personal:"",notes:[]}); }
function openEdit(id){ const c=DATA.find(x=>x.id===id); editingId=id; draftNotes=JSON.parse(JSON.stringify(c.notes||[])); showModal(c); }
function closeModal(){ document.getElementById('ov').classList.remove('show'); }

function showModal(c){
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="m-head">
      <div class="av">${c.name?initials(c.name):'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'}</div>
      <h2>${editingId?esc(c.name):'New VIP'}<small>${editingId?'Edit relationship record':'Add to your core network'}</small></h2>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <div class="m-body">
      <div class="row2">
        <div class="field"><label>Name</label><input id="f-name" value="${esc(c.name)}" placeholder="Full name"></div>
        <div class="field"><label>Line of business</label><input id="f-biz" value="${esc(c.biz)}" placeholder="e.g. Investor"></div>
      </div>
      <div class="field"><label>Relationship stage</label>
        <div class="stagepick" id="f-stage">
          ${STAGES.map(s=>`<button type="button" data-s="${s.k}" class="${c.stage===s.k?'on':''}"
            style="${c.stage===s.k?`background:${s.c}`:''}" onclick="pickStage(this,'${s.k}','${s.c}')">${s.k}</button>`).join('')}
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Phone</label><input id="f-phone" value="${esc(c.phone)}" placeholder="Phone"></div>
        <div class="field"><label>Email</label><input id="f-email" value="${esc(c.email)}" placeholder="Email"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Priority (stars)</label>
          <select id="f-rank"><option value="0">— none —</option><option value="1">★ Low</option><option value="2">★★ Medium</option><option value="3">★★★ High</option></select></div>
        <div class="field"><label>Last touch</label><input type="date" id="f-touch" value="${c.lastTouch||''}"></div>
      </div>
      <div class="field"><label>Next action</label><input id="f-next" value="${esc(c.next)}" placeholder="e.g. Coffee invite, send referral"></div>
      <div class="field"><label>Next follow-up date</label>
        <input type="date" id="f-followup" value="${c.followUp||''}" onchange="syncCal()">
        <div class="cadence">
          <button type="button" onclick="setFU(3)">+3 days</button>
          <button type="button" onclick="setFU(7)">+1 week</button>
          <button type="button" onclick="setFU(14)">+2 weeks</button>
          <button type="button" onclick="setFU(30)">+1 month</button>
          <button type="button" class="clr" onclick="setFU(null)">clear</button>
        </div>
        <a id="f-gcal" class="gcal off" href="#" target="_blank">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Add this reminder to Google Calendar</a>
      </div>
      <div class="give-get">
        <div class="field gg-give"><label>What I can give them</label><textarea id="f-give" placeholder="Value you bring…">${esc(c.give)}</textarea></div>
        <div class="field gg-get"><label>What they can give me</label><textarea id="f-get" placeholder="What you'd ask for…">${esc(c.get)}</textarea></div>
      </div>
      <div class="field"><label>Personal — birthdays, family, interests</label><textarea id="f-personal" placeholder="The human stuff that builds real relationships…">${esc(c.personal)}</textarea></div>

      <div class="notes-sec">
        <div class="hd"><b>Notes log</b>
          ${editingId?'<button class="touch-btn" onclick="logTouch()">＋ Log a touch today</button>':''}</div>
        <div class="note-add">
          <input id="f-newnote" placeholder="Add a note…" onkeydown="if(event.key==='Enter')addNote()">
          <button onclick="addNote()">Add</button></div>
        <div id="notes-list"></div>
      </div>
    </div>
    <div class="m-foot">
      ${editingId?'<button class="del-btn" onclick="delContact()">Delete</button>':''}
      <button class="save-btn" onclick="saveContact()">${editingId?'Save changes':'Add VIP'}</button>
    </div>`;
  document.getElementById('f-rank').value=String(c.rank||0);
  renderNotes(); syncCal();
  document.getElementById('ov').classList.add('show');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}
function setFU(days){
  const inp=document.getElementById('f-followup');
  if(days===null){ inp.value=''; } else {
    const d=new Date(); d.setDate(d.getDate()+days); inp.value=d.toISOString().slice(0,10);
  }
  syncCal();
}
function syncCal(){
  const v=document.getElementById('f-followup').value;
  const a=document.getElementById('f-gcal');
  if(!v){ a.classList.add('off'); a.href='#'; return; }
  a.classList.remove('off');
  const tmp={name:document.getElementById('f-name').value||'VIP', biz:document.getElementById('f-biz').value,
    next:document.getElementById('f-next').value, phone:document.getElementById('f-phone').value,
    email:document.getElementById('f-email').value, followUp:v};
  a.href=gcalLink(tmp);
}
function pickStage(btn,k,col){
  document.querySelectorAll('#f-stage button').forEach(b=>{b.classList.remove('on');b.style.background='';});
  btn.classList.add('on'); btn.style.background=col; btn.dataset.cur="1";
  document.getElementById('f-stage').dataset.val=k;
}
function curStage(){ return document.getElementById('f-stage').dataset.val || STAGES.find(s=>document.querySelector(`#f-stage button[data-s="${s.k}"]`).classList.contains('on'))?.k || "Identified"; }

function renderNotes(){
  const el=document.getElementById('notes-list');
  if(!draftNotes.length){ el.innerHTML='<div class="empty-n">No notes yet — log your interactions to track the relationship.</div>'; return; }
  el.innerHTML=draftNotes.map((n,i)=>`<div class="note"><div class="d">${n.date}<span class="del" onclick="rmNote(${i})">✕</span></div>${esc(n.text)}</div>`).join('');
}
function addNote(){
  const inp=document.getElementById('f-newnote'); const t=inp.value.trim(); if(!t) return;
  draftNotes.unshift({date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),text:t});
  inp.value=''; renderNotes();
}
function logTouch(){
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('f-touch').value=today;
  draftNotes.unshift({date:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),text:'📍 Touched base.'});
  renderNotes();
}
function rmNote(i){ draftNotes.splice(i,1); renderNotes(); }

async function saveContact(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){ document.getElementById('f-name').focus(); document.getElementById('f-name').style.borderColor='var(--orange)'; return; }
  const obj={
    name, biz:document.getElementById('f-biz').value.trim(), stage:curStage(),
    rank:parseInt(document.getElementById('f-rank').value)||0,
    phone:document.getElementById('f-phone').value.trim(), email:document.getElementById('f-email').value.trim(),
    lastTouch:document.getElementById('f-touch').value, next:document.getElementById('f-next').value.trim(),
    followUp:document.getElementById('f-followup').value,
    give:document.getElementById('f-give').value.trim(), get:document.getElementById('f-get').value.trim(),
    personal:document.getElementById('f-personal').value.trim(), notes:draftNotes
  };
  if(editingId){ const c=DATA.find(x=>x.id===editingId); Object.assign(c,obj); }
  else { obj.id="v"+Date.now()+"_"+Math.random().toString(36).slice(2,6); DATA.push(obj); }
  await save(); buildCatFilter(); render(); closeModal();
}
async function delContact(){
  if(!confirm("Remove this VIP from your core list?")) return;
  DATA=DATA.filter(x=>x.id!==editingId); await save(); buildCatFilter(); render(); closeModal();
}
async function resetAll(){
  if(!confirm("Reset back to your original list? This erases all edits, notes, and added contacts.")) return;
  DATA=seedData(); await save(); buildCatFilter(); render();
}
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

load();
</script>
